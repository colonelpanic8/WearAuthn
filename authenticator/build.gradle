apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    kotlinOptions {
        jvmTarget = "1.8"
    }
    signingConfigs {
        testSign {
            storeFile file('../ci_keystore.jks')
            storePassword 'hunter2'
            keyAlias 'key0'
            keyPassword 'hunter2'
        }
        if (System.getenv("ANDROID_KEYSTORE_FILE")) {
            releaseSign {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storeType "pkcs12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
        nightlySign {
            storeFile file('../nightly_keystore.jks')
            storePassword project.hasProperty("storePassword") ? project.storePassword : ""
            keyAlias 'key0'
            keyPassword project.hasProperty("keyPassword") ? project.keyPassword : ""
        }
    }
    compileSdk 35
    defaultConfig {
        applicationId "me.henneke.wearauthn.authenticator"
        minSdk 28
        targetSdk 33
        versionCode makeVersionCode(minSdkVersion.apiLevel, true)
        versionName makeVersionName()
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.releaseSign : signingConfigs.testSign
        }
        debug {
            minifyEnabled false
        }
        signed {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.nightlySign
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        playStore {
            dimension "distribution"
        }
        nightly {
            dimension "distribution"
            applicationIdSuffix ".nightly"
            versionCode getNightlyVersionCode()
            versionName getNightlyVersionName()
        }
    }
    namespace 'me.henneke.wearauthn'
    buildFeatures {
        buildConfig true
        compose true
        viewBinding true
    }
    applicationVariants.configureEach { variant ->
        variant.resValue "string", "application_id", variant.applicationId
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                useJUnitPlatform()
                if (project.hasProperty("screenshots")) {
                    filter { includeTestsMatching "me.henneke.wearauthn.ui.PreviewScreenshots" }
                    systemProperty "roborazzi.test.record", "true"
                    // Robolectric native graphics reads DirectByteBuffer addresses.
                    jvmArgs "--add-opens=java.base/java.nio=ALL-UNNAMED"
                    outputs.upToDateWhen { false }
                    doFirst { delete layout.buildDirectory.dir("screenshots") }
                } else {
                    filter { excludeTestsMatching "me.henneke.wearauthn.ui.PreviewScreenshots" }
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.wear:wear:1.3.0'

    // Compose 1.12 and Wear Compose 1.7 need AGP 9.1 and compileSdk 37.
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // 1.11 needs compileSdk 36 and AGP 8.9.1.
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.wear.compose:compose-foundation:1.6.2'
    implementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'androidx.wear.compose:compose-navigation:1.6.2'
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'

    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    // The oldest vintage engine that parses JUnit 4.13.2's version string.
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.7.2'
    testImplementation platform('androidx.compose:compose-bom:2026.06.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.78.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.78.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support:1.78.0'
    testImplementation 'io.github.sergio-sastre.ComposablePreviewScanner:android:0.10.0'
    testImplementation 'io.kotlintest:kotlintest-runner-junit5:3.4.2'
    testImplementation 'org.slf4j:slf4j-nop:2.0.0-alpha1'
}
